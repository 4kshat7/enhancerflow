name: rose2
description: Identify super-enhancers from ChIP-seq data using ROSE2 algorithm
keywords:
  - epigenetics
  - enhancers
  - super-enhancers
  - chip-seq
  - H3K27ac
tools:
  - rose2:
      description: Rank Ordering of Super-Enhancers
      homepage: https://github.com/younglab/ROSE
      documentation: https://github.com/younglab/ROSE
      tool_dev_url: https://github.com/younglab/ROSE
      licence: ["GPL v2"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - peaks:
        type: file
        description: Peak file in narrowPeak or BED format from H3K27ac ChIP-seq
        pattern: "*.{narrowPeak,bed}"
    - bam:
        type: file
        description: Sorted and indexed BAM file for H3K27ac signal
        pattern: "*.bam"
    - bam_index:
        type: file
        description: BAM index file
        pattern: "*.bam.bai"
    - control_bam:
        type: file
        description: Control BAM file (optional)
        pattern: "*.bam"
    - control_index:
        type: file
        description: Control BAM index file (optional)
        pattern: "*.bam.bai"
  - gtf:
      type: file
      description: GTF annotation file for TSS identification
      pattern: "*.gtf"
  - genome:
      type: string
      description: Genome assembly name (e.g., hg38, mm10)
  - custom_genome:
      type: file
      description: |
        Optional custom ROSE2 gene annotation table (16-column UCSC refGene
        layout) for assemblies with no built-in annotation. When provided it is
        passed as `--custom`, which replaces `-g`. Pass `[]` when absent.
      pattern: "*.ucsc"

output:
  - all_enhancers:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_AllStitched.table.txt":
          type: file
          description: Table of all stitched enhancers with H3K27ac signal
          pattern: "*_AllStitched.table.txt"
  - super_enhancers:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_SuperStitched.table.txt":
          type: file
          description: Table of super-enhancers identified by inflection point
          pattern: "*_SuperStitched.table.txt"
  - super_region_to_gene:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_SuperStitched.table_REGION_TO_GENE.txt":
          type: file
          description: Super-enhancer regions with their overlapping, proximal and closest genes
          pattern: "*_SuperStitched.table_REGION_TO_GENE.txt"
  - super_gene_to_region:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_SuperStitched.table_GENE_TO_REGION.txt":
          type: file
          description: Genes with the super-enhancer regions assigned to them
          pattern: "*_SuperStitched.table_GENE_TO_REGION.txt"
  - super_with_genes:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_SuperStitched.table.table_withGENES.txt":
          type: file
          description: Super-enhancer table with gene assignment columns appended
          pattern: "*_SuperStitched.table.table_withGENES.txt"
  - all_region_to_gene:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_AllStitched.table_REGION_TO_GENE.txt":
          type: file
          description: All stitched regions with their overlapping, proximal and closest genes
          pattern: "*_AllStitched.table_REGION_TO_GENE.txt"
  - all_gene_to_region:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_AllStitched.table_GENE_TO_REGION.txt":
          type: file
          description: Genes with the stitched regions assigned to them
          pattern: "*_AllStitched.table_GENE_TO_REGION.txt"
  - all_with_genes:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_AllStitched.table.table_withGENES.txt":
          type: file
          description: All-stitched table with gene assignment columns appended
          pattern: "*_AllStitched.table.table_withGENES.txt"
  - plot:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*/*_Plot_points.png":
          type: file
          description: Plot showing enhancer ranking and SE cutoff
          pattern: "*_Plot_points.png"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@asntech"
maintainers:
  - "@asntech"
